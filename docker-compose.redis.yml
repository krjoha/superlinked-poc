version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: superlinked-redis-stack
    ports:
      - "6379:6379"    # Redis server
      - "8001:8001"    # RedisInsight UI
    environment:
      # Redis configuration
      - REDIS_ARGS=--save 60 1000 --appendonly yes --appendfsync everysec
    volumes:
      # Persistent storage for Redis data (RDB + AOF)
      - redis-data:/data
      # Custom Redis configuration (optional override)
      - ./config/redis.conf:/redis-stack.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - superlinked-network
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis

networks:
  superlinked-network:
    driver: bridge
