# Redis Configuration for Superlinked Vector Database
# Production-ready settings for persistence and performance

# ============================================================================
# PERSISTENCE CONFIGURATION (Hybrid RDB + AOF)
# ============================================================================

# RDB Snapshots - Point-in-time backup
# Save after 900 sec (15 min) if at least 1 key changed
save 900 1
# Save after 300 sec (5 min) if at least 10 keys changed
save 300 10
# Save after 60 sec if at least 10000 keys changed
save 60 10000

# Compress RDB files
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append-Only File) - Write-ahead log for durability
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy: everysec is good balance of performance/durability
# Options: always (slow, safest), everysec (recommended), no (fast, least safe)
appendfsync everysec

# Enable AOF rewrite to keep file size manageable
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================

# Maximum memory policy - evict least recently used keys when limit reached
# For vector database, we want to keep data, so use noeviction
maxmemory-policy noeviction

# Don't set maxmemory here - let Docker resource limits handle it
# maxmemory 1gb

# ============================================================================
# NETWORK & SECURITY
# ============================================================================

# Bind to all interfaces (Docker handles network isolation)
bind 0.0.0.0

# Protected mode off since we're using Docker networking
protected-mode no

# Connection limits
maxclients 10000
timeout 300

# TCP keepalive
tcp-keepalive 300

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# Disable transparent huge pages warning
always-show-logo no

# Lazy freeing for better performance on deletes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Active defragmentation (Redis 4.0+)
activedefrag yes

# ============================================================================
# LOGGING
# ============================================================================

# Log level: debug, verbose, notice, warning
loglevel notice

# Log to stdout for Docker logging
logfile ""

# ============================================================================
# REDIS MODULES (Redis Stack includes these automatically)
# ============================================================================

# RediSearch - Vector similarity search
# RedisJSON - JSON document storage
# RedisGraph - Graph database
# RedisTimeSeries - Time series data
# RedisBloom - Probabilistic data structures

# These are loaded automatically by Redis Stack image
